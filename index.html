<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1921"><link rel="manifest" href="manifest.webmanifest"><title>Survie du Corbeau V0.2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eff3;background:#0e1921}*{box-sizing:border-box}body{margin:0;padding:22px 16px 90px;max-width:760px;margin-inline:auto}h1{font-size:2rem;margin:12px 0}h2{margin:0 0 14px;font-size:1.35rem}p,.muted{color:#afbec8}header p{margin-top:0}.card{background:#1b2b36;border:1px solid #38505d;border-radius:20px;padding:19px;margin:16px 0;box-shadow:0 4px 15px #0002}.meter{margin:13px 0 18px}.line{display:flex;justify-content:space-between;gap:12px;align-items:center}.bar{height:13px;background:#3a4750;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;border-radius:20px;transition:width .3s}.negative{color:#ff8787}.small{font-size:.85rem;color:#b9c7d0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{background:#365b70;border:1px solid #51768a;color:white;padding:12px 14px;border-radius:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}button.primary{background:#d6a849;color:#17232b;border-color:#e9c879}button.danger{background:#693a43}input{background:#0f1b23;color:white;border:1px solid #6b8492;border-radius:9px;padding:9px;width:100%}.skill{border-top:1px solid #40515b;padding:17px 0}.skill:first-child{border-top:0}.skill h3{margin:0;font-size:1.06rem}.skill .actions button{font-size:.86rem}.badge{border-radius:99px;padding:4px 8px;background:#314d60;font-size:.75rem}.note{background:#253741;padding:12px;border-radius:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>*{min-width:0}details{margin:16px 0}summary{cursor:pointer;font-weight:700}.footer{font-size:.8rem;color:#95aab7}.clock{font-variant-numeric:tabular-nums;font-weight:700;color:#f2c96f}@media(max-width:380px){body{padding-inline:10px}.card{padding:13px}button{padding:10px}}
</style></head><body><header><h1>🐦‍⬛ Survie du Corbeau</h1><p>V0.2 · L'Éveil des Compétences</p></header><div id="app"></div><script>
(()=>{'use strict';const KEY='corbeau-survie-v02',OLD=['corbeau-survie-v01','survie-du-corbeau-v01'];const specs=[['sport','🦁','Sport',20],['rando','🏹','Randonnée',68],['hygiene','🧹','Hygiène',28],['cuisine','🍲','Cuisine',27],['montage','🎬','Montage vidéo',43],['drone','🪽','Drone',18],['travail','🪨','Travail alimentaire',157],['russe','📚','Parler russe',12],['admin','🗒️','Administratif',9]];const now=()=>Date.now(),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));const defaults=()=>({version:2,updated:now(),energy:100,food:100,water:100,alert:100,awakeSince:now(),sleeping:false,sleepStart:null,caffeine:0,restStart:null,skills:Object.fromEntries(specs.map(([id,, ,level])=>[id,{level,xp:0,reserve:level,running:false,started:null,elapsed:0}]))});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}if(!state.skills)state=defaults();for(const [id,,,level] of specs){if(!state.skills[id])state.skills[id]={level,xp:0,reserve:level,running:false,started:null,elapsed:0}}let activeTab='survie';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{state.updated=now();localStorage.setItem(KEY,JSON.stringify(state))};const minuteCost=(s)=>{const debt=Math.max(0,-s.reserve);return .2*(1+debt/Math.max(1,s.level))};function tick(){let t=now(),dt=clamp((t-state.updated)/60000,0,60*24*14);if(dt<=0)return;state.food=clamp(state.food-dt*.12,0,100);state.water=clamp(state.water-dt*.18,0,100);if(!state.sleeping){state.alert=clamp(state.alert-dt*(100/(17*60)),0,100)}else{state.alert=clamp(state.alert+dt*(100/(8*60)),0,100)}for(const s of Object.values(state.skills)){if(s.running){const start=s.reserve;let whole=Math.floor((s.elapsed||0)+dt),fraction=((s.elapsed||0)+dt)-whole;s.elapsed=fraction;for(let i=0;i<whole;i++){s.reserve-=1;s.xp+=1;while(s.xp>=s.level+1){s.xp-=s.level+1;s.level++}state.energy-=.2*(1+Math.max(0,-s.reserve)/Math.max(1,s.level))}}else{s.reserve=Math.min(s.level,s.reserve+dt*s.level/1440)}}if(state.restStart&&!state.sleeping)state.energy=Math.min(100,state.energy+dt*.30*((t-state.awakeSince)/3600000>17?.25:1));if(state.sleeping)state.energy=Math.min(100,state.energy+dt*.35);let needPenalty=(100-state.food+100-state.water+100-state.alert)/300;state.energy-=dt*.015*needPenalty;state.updated=t;save()}
function bar(label,value,max,color){const pct=clamp(value/max*100,0,100);return `<div class="meter"><div class="line"><strong>${label}</strong><span class="${value<0?'negative':''}">${Math.round(value*10)/10}/${max}</span></div><div class="bar"><div class="fill" style="width:${pct}%;background:${value<0?'#f07176':color}"></div></div>${value<0?`<div class="small negative">Dette : ${Math.abs(Math.round(value))} points</div>`:''}</div>`}
function fmt(n){let h=Math.floor(n/60),m=Math.floor(n%60);return `${h} h ${String(m).padStart(2,'0')} min`}
function view(){tick();let awake=(now()-state.awakeSince)/3600000;let html=`<div class="actions"><button data-tab="survie" class="${activeTab==='survie'?'primary':''}">⚡ Survie</button><button data-tab="skills" class="${activeTab==='skills'?'primary':''}">📈 Compétences</button><button data-tab="settings" class="${activeTab==='settings'?'primary':''}">⚙️ Données</button></div>`;if(activeTab==='survie'){html+=`<section class="card"><h2>État du personnage</h2>${bar('⚡ Énergie',state.energy,100,'#eac467')}${bar('🍲 Satiété',state.food,100,'#f4a366')}${bar('💧 Hydratation',state.water,100,'#4cb6e8')}${bar('🌙 Vigilance',state.alert,100,'#a997ee')}<p class="small">${state.sleeping?'😴 Sommeil en cours':`Éveil : ${awake.toFixed(1)} h / 17 h ${awake>17?'· ⚠️ Seuil dépassé':''}`}</p></section><section class="card"><h2>🍲 Besoins</h2><div class="actions"><button data-act="meal">🍽️ Repas (+40)</button><button data-act="snack">🍎 Collation (+15)</button><button data-act="water">💧 Eau (+30)</button><button data-act="coffee">☕ Caféine (+${Math.round(15*Math.pow(.65,state.caffeine))})</button></div><p class="small">Caféine utilisée ${state.caffeine} fois depuis le dernier réveil. Bonus décroissant.</p><div class="actions"><button data-act="sleep" class="${state.sleeping?'primary':''}">${state.sleeping?'🌞 Terminer le sommeil':'🌙 Commencer le sommeil'}</button><button data-act="rest" class="${state.restStart?'primary':''}" ${state.sleeping?'disabled':''}>${state.restStart?'⏸️ Arrêter le temps libre':'▶️ Commencer le temps libre'}</button></div><p class="small">Temps libre : +0,30 énergie/min. Sommeil : +0,35 énergie/min (valeurs de jeu). Après 17 h d'éveil, le gain d'énergie des actions est réduit de 75 % jusqu'au prochain sommeil.</p></section>`}else if(activeTab==='skills'){html+=`<section class="card"><h2>📈 Les 9 compétences</h2><p class="small">1 min = 1 XP et −1 réserve. La réserve se régénère uniquement chronomètre arrêté, à raison du niveau / 24 h. Aucune limite négative.</p>`;for(const [id,emoji,name] of specs){let s=state.skills[id],xpMax=s.level+1;html+=`<article class="skill"><div class="line"><h3>${emoji} ${name}</h3><strong>LV ${s.level}</strong></div><div class="small">XP : ${s.xp}/${xpMax}</div><div class="bar" style="height:7px"><div class="fill" style="background:#75cfa5;width:${clamp(s.xp/xpMax*100,0,100)}%"></div></div>${bar('Réserve',s.reserve,s.level,'#5dc19b')}<div class="line"><span class="small">Régénération : +${(s.level/24).toFixed(2)} pts/h</span><span class="badge">${s.running?'● En activité':'Au repos'}</span></div><div class="actions"><button data-skill="${id}" class="${s.running?'danger':'primary'}">${s.running?'⏹️ Arrêter':'▶️ Démarrer'}</button></div></article>`}html+='</section>'}else{html+=`<section class="card"><h2>⚙️ Sauvegardes</h2><p>Les données sont enregistrées sur cet appareil et dans ce navigateur. Exporte régulièrement une sauvegarde JSON.</p><div class="actions"><button data-act="export">⬇️ Exporter la sauvegarde</button><button data-act="import">⬆️ Importer une sauvegarde V0.2</button><button data-act="reset" class="danger">Réinitialiser V0.2</button></div><input type="file" id="importFile" accept="application/json,.json" hidden><details><summary>Règles et limites du prototype</summary><p class="small">Cette V0.2 conserve ses propres données. L'import automatique depuis la V0.1 n'est pas garanti car son format de sauvegarde n'a pas été vérifié. Une seule compétence peut tourner à la fois. La fatigue progressive coûte 0,2 énergie/min, multipliée par (1 + dette/niveau). La récupération de l'énergie reste constante, sauf malus d'éveil prolongé. Ces jauges sont fictives et ne mesurent pas ta santé.</p></details></section>`}html+=`<p class="footer">Survie du Corbeau · V0.2 · Jeu personnel, pas une mesure médicale. Les besoins réels et la sécurité passent avant les jauges.</p>`;$('#app').innerHTML=html}
function addEnergy(n){let awake=(now()-state.awakeSince)/3600000;state.energy=Math.min(100,state.energy+n*(awake>17?.25:1))}document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.tab){activeTab=el.dataset.tab;view();return}tick();let a=el.dataset.act,id=el.dataset.skill;if(id){for(const [k,s] of Object.entries(state.skills)){if(k!==id&&s.running){alert('Arrête d’abord la compétence en cours.');return}}let s=state.skills[id];s.running=!s.running;s.started=s.running?now():null}else if(a==='meal'){state.food=clamp(state.food+40,0,100);addEnergy(6)}else if(a==='snack'){state.food=clamp(state.food+15,0,100);addEnergy(2)}else if(a==='water'){state.water=clamp(state.water+30,0,100);addEnergy(3)}else if(a==='coffee'){addEnergy(15*Math.pow(.65,state.caffeine));state.caffeine++}else if(a==='rest'){state.restStart=state.restStart?null:now()}else if(a==='sleep'){if(!state.sleeping){state.sleeping=true;state.sleepStart=now();state.restStart=null;for(const s of Object.values(state.skills))s.running=false}else{state.sleeping=false;state.sleepStart=null;state.awakeSince=now();state.caffeine=0;state.alert=100}}else if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='corbeau-v02-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}else if(a==='import'){$('#importFile').click();return}else if(a==='reset'){if(confirm('Réinitialiser toutes les données V0.2 ? Cette action est irréversible sans sauvegarde.'))state=defaults()}save();view()});document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==2||!data.skills||!specs.every(([id])=>data.skills[id]&&Number.isFinite(data.skills[id].level)))throw Error('Format V0.2 non reconnu');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state=data;state.updated=now();save();view()}catch(err){alert('Import impossible : '+err.message)}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)view()});setInterval(()=>{if(!document.hidden)view()},15000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});view();})();
</script></body></html>
